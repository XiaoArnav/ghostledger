version: '3.8'

services:
  ghostledger:
    build: .
    container_name: ghostledger-app
    ports:
      - "8765:8765"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - GEMMA_MODEL=gemma2:2b
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ghostledger-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
