[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostledger"
version = "1.0.0"
description = "GhostLedger // 2100 • Zero-Leak Air-Gapped Receipt & Expense Intelligence for Freelancers • Powered by Gemma 2"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "GhostLedger Contributors" }
]
keywords = ["gemma2", "privacy", "receipt-scanner", "taxes", "schedule-c", "accounting", "freelance", "zero-leak", "air-gapped"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
"Homepage" = "https://ghostledger-topaz.vercel.app"
"Repository" = "https://github.com/XiaoArnav/ghost-ledger"
"Bug Tracker" = "https://github.com/XiaoArnav/ghost-ledger/issues"

[project.scripts]
ghostledger = "privatereceipt.cli:main"
privatereceipt = "privatereceipt.cli:main"
